<!DOCTYPE html> 
<html>
    <head>
        <title>STUDENT SERVICE REQUEST </title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header>
            <h1>Student Service Request Portal</h1>
            <p>Submit your service requests online.</p>
        </header>

        <nav>
            <a href="#">HOME</a>
            <a href="#">SERVICES</a>
            <a href="#">CONTACT</a>

        </nav>
    <main>
        <section>
            <h2>Student Service Request Form</h2>

            <form>
                <table>
                    <tr>
                     <td>Student Name:</td> 
                     <td><input type="text"></td>
                    </tr>
                    
                    <tr>
                     <td>Student ID:</td> 
                     <td><input type="text"maxlength="10" required></td>
                    </tr>

                    <tr>
                     <td>Email:</td> 
                     <td><input type="email" required></td>
                    </tr>

                    <tr>
                     <td>Service Type:</td> 
                     <td>
                        <select>
                            <option>Transcript Request</option>
                            <option>ID Card Issue</option>
                            <option>General Inquiry</option>
                        </select>
                     </td>
                    </tr>

                    <tr>
                     <td>Urgency Level:</td> 
                     <td>
                        <input type="radio"name= urgency>LOW
                        <input type="radio"name= urgency>MEDIUM
                        <input type="radio"name= urgency>HIGH
                    </td>
                    </tr>

                    <tr>
                     <td>Additional Details:</td> 
                     <td><textarea rows="5" cols="30"></textarea></td>
                    </tr>
                   
                    <tr>
                        <td></td>
                     <td><input type="submit" value= SUBMIT></td> 
                    
                    </tr>

                </table>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy;2026 Student Affair Department</p>
    </footer>

    </body>
</html>
